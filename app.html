<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>盯盘快讯</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 顶栏：Tab 切换 + 状态 -->
    <header class="topbar">
      <nav class="tabs">
        <button class="tab active" data-tab="quotes">行情</button>
        <button class="tab" data-tab="sectors">板块</button>
        <button class="tab" data-tab="news">快讯</button>
        <button class="tab" data-tab="calendar">日历</button>
      </nav>
      <div class="topbar-right">
        <span id="src-dot" class="src-dot" title="数据源状态"></span>
        <select id="refresh-select" class="refresh-select" title="刷新间隔">
          <option value="5000">5s</option>
          <option value="15000" selected>15s</option>
          <option value="30000">30s</option>
        </select>
      </div>
    </header>

    <!-- 行情 Tab -->
    <main id="panel-quotes" class="panel active">
      <!-- 指数横滑 -->
      <div id="index-row" class="index-row"></div>
      <!-- 涨跌家数情绪条 + 盘中资金面 -->
      <div class="breadth">
        <div id="breadth-bar" class="breadth-bar"></div>
        <div id="breadth-labels" class="breadth-labels"></div>
        <div id="market-flow" class="market-flow"></div>
      </div>
      <!-- 自选股 -->
      <section class="block">
        <div class="block-head">
          <span class="block-title">自选股</span>
          <button id="add-watch-btn" class="mini-btn">＋ 添加</button>
        </div>
        <div id="watch-list" class="watch-list"></div>
        <div id="search-box" class="search-box hidden">
          <input id="search-input" type="text" placeholder="代码 / 名称 / 拼音" autocomplete="off" />
          <div id="search-result" class="search-result"></div>
        </div>
      </section>
      <!-- 分时抽屉 -->
      <div id="trend-drawer" class="trend-drawer hidden">
        <div class="trend-head">
          <span id="trend-name"></span>
          <div class="trend-right">
            <div class="seg">
              <button class="seg-btn active" data-range="1d">1日</button>
              <button class="seg-btn" data-range="7d">7日</button>
              <button class="seg-btn" data-range="1m">1月</button>
              <button class="seg-btn" data-range="6m">半年</button>
            </div>
            <button id="trend-close" class="mini-btn">关闭</button>
          </div>
        </div>
        <canvas id="trend-canvas" width="340" height="150"></canvas>
      </div>
    </main>

    <!-- 板块 Tab -->
    <main id="panel-sectors" class="panel hidden">
      <section class="block">
        <div class="block-head">
          <span class="block-title">板块</span>
          <div class="seg">
            <button class="seg-btn active" data-dir="up">涨幅榜</button>
            <button class="seg-btn" data-dir="down">跌幅榜</button>
          </div>
        </div>
        <div id="sector-list" class="sector-list"></div>
      </section>
    </main>

    <!-- 快讯 Tab -->
    <main id="panel-news" class="panel hidden">
      <div class="news-filter">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="important">重要</button>
        <button class="filter-btn" data-filter="a">A股</button>
        <button class="filter-btn" data-filter="board">板块</button>
      </div>
      <div id="new-badge" class="new-badge hidden"></div>
      <div id="news-list" class="news-list"></div>
      <div id="news-end" class="news-end">没有更多了</div>
    </main>

    <!-- 日历 Tab -->
    <main id="panel-calendar" class="panel hidden">
      <div class="cal-toolbar">
        <div class="seg">
          <button class="seg-btn" data-caldate="yesterday">昨日</button>
          <button class="seg-btn active" data-caldate="today">今日</button>
          <button class="seg-btn" data-caldate="tomorrow">明日</button>
        </div>
        <div class="seg">
          <button class="seg-btn active" data-calfilter="all">全部</button>
          <button class="seg-btn" data-calfilter="data">数据</button>
          <button class="seg-btn" data-calfilter="event">事件</button>
        </div>
      </div>
      <div id="ipo-block" class="ipo-block hidden">
        <div class="block-head">
          <span class="block-title">打新</span>
          <span id="ipo-count" class="ipo-count"></span>
        </div>
        <div id="ipo-list"></div>
      </div>
      <div id="calendar-list" class="cal-list"></div>
    </main>

    <div id="error-banner" class="error-banner hidden"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
